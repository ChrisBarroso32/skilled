query Skills($searchTerm: String = "", $limit: Int = 10) @auth(
    level: PUBLIC
    insecureReason: "Skills should be visible be visible to everyone"
    ) {
        skills(
            where: {
                _or: [
                    { title: { contains: $searchTerm }}
                    { description: { contains: $searchTerm }}
                ]
            },
            orderBy: [
                { 
                    createdAt: DESC
                }
            ],
            limit: $limit
        ) {
            id title description tags createdAt installCommand
            author { userName imageUrl clerkId email }
        }
    }